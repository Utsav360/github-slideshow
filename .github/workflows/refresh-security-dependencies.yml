name: Refresh security dependencies

on:
  push:
    branches:
      - agent/fix-github-slideshow-dependencies

permissions:
  contents: write

jobs:
  refresh-ruby-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-github-slideshow-dependencies
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Refresh Ruby dependencies
        run: |
          gem install bundler --no-document
          bundle _4.0.18_ update
          bundle _4.0.18_ exec jekyll build
          rm -rf node_modules/reveal.js
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git add -u node_modules/reveal.js
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Ruby dependency lockfile [dependency-refresh]"
          git push
